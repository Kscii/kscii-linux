# ThinkPad Engineering Edition — fuzzel 启动器
# Alt+Space → 应用启动器（类 Spotlight 风格）

[main]
font=IBM Plex Mono:size=11
dpi-aware=yes
icon-theme=Papirus-Dark
icons-enabled=yes
terminal=kitty
width=48
lines=10
tabs=4
result-spacing=4
prompt=
anchor=center
x-offset=0
y-offset=0

[colors]
# ThinkPad 纯黑 + 红
background=000000ff
text=ffffffff
match=E2000Fff
selection=E2000F22
selection-text=ffffffff
selection-match=E2000Fff
border=E2000Fff

[border]
width=1
radius=0

[dmenu]
# 供 Alt+Tab 窗口选择器使用（niri-window-picker.sh）
# 自动继承上方颜色配置
