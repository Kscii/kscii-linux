# niri 的 xdg-desktop-portal 后端选择
# 文件路径：~/.config/xdg-desktop-portal/portals.conf

[preferred]
# 默认：GNOME portal 处理屏幕录制；GTK portal 处理文件选择器
default=gnome;gtk;

# 文件选择器：GTK portal（标准文件选择对话框）
org.freedesktop.impl.portal.FileChooser=gtk

# 截图 / 屏幕录制：GNOME portal（原生 Wayland）
org.freedesktop.impl.portal.Screenshot=gnome
org.freedesktop.impl.portal.Screencast=gnome

# 后台运行：GNOME portal
org.freedesktop.impl.portal.Background=gnome

# 设置（GTK 主题等）
org.freedesktop.impl.portal.Settings=gnome
