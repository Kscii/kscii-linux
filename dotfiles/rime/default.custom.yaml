# Rime 全局自定义配置
# 在 rime-ice 默认配置基础上叠加
# 部署路径：~/.local/share/fcitx5/rime/default.custom.yaml

patch:
  # 每页显示 6 个候选词
  menu/page_size: 6

  # Shift-L：提交当前拼音缓冲区为原始 ASCII 并切换至英文
  # Shift-R：无操作（避免误切换）
  ascii_composer/good_old_caps_lock: true
  ascii_composer/switch_key:
    Shift_L: commit_text
    Shift_R: noop
    Control_L: noop
    Control_R: noop
    Caps_Lock: noop

  # 只加载雾凇拼音；移除五笔和万象输入法
  schema_list:
    - schema: rime_ice
