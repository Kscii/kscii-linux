#? btop 配置文件 — ThinkPad Engineering Edition

# 主题文件（位于 ~/.config/btop/themes/）
color_theme = "thinkpad.theme"

# 使用终端背景色（false 表示由主题控制背景）
theme_background = False

# 启用 24 位真彩色
truecolor = True

# TTY 模式（强制 16 色）：关闭
force_tty = False

# 启用 vim 风格 hjkl 导航（H 帮助 / K 终止进程时需按住 Shift）
vim_keys = True

# 圆角：关闭（工程美学风格）
rounded_corners = False

# 图表样式：braille 点阵（在 kitty 中分辨率最高）
graph_symbol = "braille"

# 数据更新间隔（毫秒）
update_ms = 1500

# 进程排序方式
proc_sorting = "cpu lazy"

# 以树状显示进程
proc_tree = False

# 显示 CPU 温度
check_temp = True

# CPU 双栏图表：关闭
cpu_single_graph = False

# 若系统有电池则显示电量
show_battery = True
