# ThinkPad Engineering Edition — Kitty 终端配置
# 配色：纯黑（#000000）+ ThinkPad 红（#E2000F）
# 字体：IBM Plex Mono（主字体）+ JetBrains Mono Nerd（符号回退）

# ── 字体 ──────────────────────────────────────────────────────────────────

font_family      IBM Plex Mono
bold_font        IBM Plex Mono Bold
italic_font      IBM Plex Mono Italic
bold_italic_font IBM Plex Mono Bold Italic

# 13pt — 针对 14" 3K 屏幕在 scale 1.5 下校准（约 96 DPI 逻辑分辨率）
font_size 13.0

# Nerd Font 符号回退：用于 yazi、starship、git 图标等
# 覆盖范围：Powerline、Nerd Fonts 核心、Material Design、Font Awesome
symbol_map U+E000-U+E00D,U+E0A0-U+E0B4,U+E0B6-U+E0C8,U+E0CA,U+E0CC-U+E0D4 JetBrainsMono Nerd Font
symbol_map U+E200-U+E2A9 JetBrainsMono Nerd Font
symbol_map U+E300-U+E3EB JetBrainsMono Nerd Font
symbol_map U+E5FA-U+E6B5,U+E700-U+E7C5 JetBrainsMono Nerd Font
symbol_map U+EA60-U+EBEB JetBrainsMono Nerd Font
symbol_map U+F000-U+F2FF JetBrainsMono Nerd Font
symbol_map U+F400-U+F533,U+F0001-U+F1AF0 JetBrainsMono Nerd Font
symbol_map U+2665,U+26A1,U+2714,U+2718,U+276F JetBrainsMono Nerd Font

# CJK 字符回退（由系统 fontconfig 处理）
font_features none

# ── 配色 ──────────────────────────────────────────────────────────────────

# OLED 最优纯黑背景
background            #000000
foreground            #e0e0e0
selection_background  #E2000F
selection_foreground  #000000
cursor                #E2000F
cursor_text_color     #000000

# 普通颜色（0-7）
color0  #000000
color1  #cc2222
color2  #22aa44
color3  #cc8800
color4  #3366cc
color5  #cc2266
color6  #2299cc
color7  #cccccc

# 高亮颜色（8-15）
color8  #444444
color9  #E2000F
color10 #44cc66
color11 #ffcc00
color12 #5588ff
color13 #ff2288
color14 #44bbee
color15 #ffffff

# URL 下划线颜色
url_color #E2000F

# ── 光标 ──────────────────────────────────────────────────────────────────

cursor_shape          block
cursor_blink_interval 0

# ── 终端响铃 ──────────────────────────────────────────────────────────────

enable_audio_bell    no
visual_bell_duration 0.0

# ── 滚动缓冲区 ────────────────────────────────────────────────────────────

scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ── 窗口外观 ──────────────────────────────────────────────────────────────

# 不显示窗口装饰（niri 负责绘制窗口边框）
hide_window_decorations yes
window_padding_width 8
window_border_width 0

# ── 标签栏 ────────────────────────────────────────────────────────────────

tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
active_tab_foreground   #000000
active_tab_background   #E2000F
active_tab_font_style   bold
inactive_tab_foreground #888888
inactive_tab_background #111111
inactive_tab_font_style normal
tab_bar_background      #000000

# ── 性能 ──────────────────────────────────────────────────────────────────

# GPU 渲染；降低输入延迟
sync_to_monitor no
repaint_delay 8
input_delay 2

# ── 快捷键 ────────────────────────────────────────────────────────────────

clear_all_shortcuts no

# 复制 / 粘贴
map ctrl+shift+c  copy_to_clipboard
map ctrl+shift+v  paste_from_clipboard
map ctrl+shift+s  paste_from_selection

# 滚动
map ctrl+shift+k  scroll_line_up
map ctrl+shift+j  scroll_line_down
map ctrl+shift+u  scroll_page_up
map ctrl+shift+d  scroll_page_down
map ctrl+shift+g  scroll_end
map ctrl+shift+h  show_scrollback

# 字号
map ctrl+equal    change_font_size all +1.0
map ctrl+minus    change_font_size all -1.0
map ctrl+0        change_font_size all 0

# 标签页
map ctrl+shift+t  new_tab
map ctrl+shift+w  close_tab
map ctrl+shift+l  next_tab
map ctrl+shift+h  previous_tab
map ctrl+shift+1  goto_tab 1
map ctrl+shift+2  goto_tab 2
map ctrl+shift+3  goto_tab 3
map ctrl+shift+4  goto_tab 4
map ctrl+shift+5  goto_tab 5

# 窗口分屏
map ctrl+shift+enter  new_window
map ctrl+shift+]      next_window
map ctrl+shift+[      previous_window

# ── 杂项 ──────────────────────────────────────────────────────────────────

# 在代码中禁用连字（个人偏好，改为 "always" 可启用）
font_features IBMPlexMono-Regular -liga

# Shell 集成
shell_integration enabled

# 允许脚本远程控制
allow_remote_control yes

# 默认 shell
shell fish

# 剪贴板权限
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
